<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReelSeat - Movie Details</title>
    <link rel="stylesheet" href="assets/css/global.css" />
    <style>
      /* Specific Layout for the New Details Design */
      .details-wrapper {
        max-width: 1000px;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }

      /* Hero Backdrop Section */
      .hero-backdrop {
        position: relative;
        width: 100%;
        height: 450px;
        background-size: cover;
        background-position: center;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 -150px 100px -50px rgba(18, 18, 20, 0.9);
      }

      .play-btn {
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid white;
        color: white;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding-left: 5px; /* visually center the play triangle */
        transition: transform 0.2s;
      }
      .play-btn:hover {
        transform: scale(1.1);
      }

      .hero-content {
        position: absolute;
        bottom: 2rem;
        left: 280px; /* Offset to make room for the overlapping poster */
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .status-dot {
        font-size: 0.9rem;
        font-weight: 500;
      }

      .hero-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.5px;
      }

      .btn-book {
        background-color: #ffffff;
        color: #000000;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 20px; /* Pill shape */
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        width: fit-content;
        margin-top: 0.5rem;
      }

      .age-rating {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        background-color: #c2410c;
        color: white;
        padding: 0.2rem 0.6rem;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      /* Lower Info Section */
      .info-section {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 2.5rem;
        margin-top: -120px; /* Pulls the section up to overlap the backdrop */
        position: relative;
        z-index: 10;
      }

      .overlap-poster {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #ef4444; /* Red border from design */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        aspect-ratio: 2 / 3;
        object-fit: cover;
      }

      .text-details-grid {
        display: grid;
        grid-template-columns: 2fr 1fr; /* Left side wider for synopsis */
        gap: 2rem;
        margin-top: 140px; /* Pushes text below the absolute hero text */
      }

      .detail-block h3 {
        font-size: 0.9rem;
        color: var(--text-main);
        margin-bottom: 0.5rem;
        font-weight: 700;
      }

      .detail-block p {
        font-size: 0.9rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .rating-box {
        color: #ef4444;
        font-size: 1rem;
        margin: 1rem 0 0.5rem 0;
      }

      .genre-list {
        list-style: none;
        padding: 0;
        margin: 0;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      /* Hidden Showtime Selector (Reveals when Book Tickets is clicked) */
      .showtime-modal {
        display: none;
        margin-top: 3rem;
        padding-top: 2rem;
        border-top: 1px solid var(--border-color);
      }

      .showtime-grid {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }

      .time-slot-btn {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        cursor: pointer;
      }
      .time-slot-btn:hover,
      .time-slot-btn.selected {
        border-color: var(--accent-red);
        background-color: rgba(229, 9, 20, 0.15);
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <a href="movies.html" class="nav-brand">
        <span class="logo-icon">🏠</span>
        <span class="logo-text">ReelSeat</span>
      </a>
      <div class="nav-icons">
        <button
          class="icon-btn"
          onclick="window.location.href = 'my-tickets.html'"
        >
          📖
        </button>
        <button class="icon-btn" onclick="window.location.href = 'movies.html'">
          🔍
        </button>
      </div>
    </header>

    <main class="main-content details-wrapper">
      <!-- Hero / Trailer Backdrop -->
      <div
        class="hero-backdrop"
        id="backdrop-img"
        style="
          background-image: url(&quot;assets/images/obsession-banner.jpg&quot;);
        "
      >
        <button class="play-btn">&#9658;</button>

        <div class="hero-content">
          <span class="status-dot">• Now showing</span>
          <h1 class="hero-title" id="detail-title">Obsession</h1>
          <button id="book-tickets-btn" class="btn-book">Book Tickets</button>
        </div>

        <span class="age-rating" id="detail-age">R-16</span>
      </div>

      <!-- Info & Poster Grid -->
      <div class="info-section">
        <div class="poster-container">
          <img
            id="detail-poster"
            src="assets/images/obsession-poster.jpg"
            alt="Poster"
            class="overlap-poster"
          />
        </div>

        <div class="text-details-grid">
          <!-- Left Column -->
          <div style="display: flex; flex-direction: column; gap: 1.5rem">
            <div class="detail-block">
              <h3>Cast</h3>
              <p id="detail-cast">
                Michael Johnston, Inde Navarrette, Cooper Tomlinson
              </p>
            </div>
            <div class="detail-block">
              <h3>Synopsis</h3>
              <p id="detail-synopsis">After breaking the mysterious...</p>
            </div>
          </div>

          <!-- Right Column -->
          <div style="display: flex; flex-direction: column; gap: 1.5rem">
            <div class="detail-block">
              <h3>Runtime</h3>
              <p id="detail-duration">1h 48m</p>
            </div>
            <div class="detail-block">
              <h3>Release date</h3>
              <p id="detail-release">8 June 2026</p>

              <div class="rating-box">
                <span>☆</span> <span id="detail-rating">8</span>
              </div>

              <ul class="genre-list" id="detail-genre-list">
                <li>• Horror</li>
                <li>• Romance</li>
                <li>• Thriller</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <!-- Showtime Selector -->
      <div id="showtime-section" class="showtime-modal">
        <h3 style="margin-bottom: 1rem">Select a Showtime</h3>
        <div id="showtime-list" class="showtime-grid"></div>
        <button
          id="proceed-seats-btn"
          class="btn-primary"
          style="margin-top: 1.5rem"
          disabled
        >
          Confirm Showtime
        </button>
      </div>
    </main>

    <script src="assets/js/store.js"></script>
    <script src="assets/js/movie-details.js"></script>
  </body>
</html>
